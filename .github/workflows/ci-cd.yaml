name: CI/CD Pipeline

on:
  push:
    branches: [ develop-1 ]
  pull_request:
    branches: [ develop-1 ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: [self-hosted, windows]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0,7))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: powershell

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ./sample-app
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }}
        docker tag ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ${{ env.DOCKER_USERNAME }}/sample-app:latest
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:latest
      shell: powershell

  test:
    needs: build
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
    - name: Checkout code
      uses: actions/checkout@v4



    - name: Install dependencies
      run: |
        cd sample-app
        & "C:\Users\USER\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install --upgrade pip
        & "C:\Users\USER\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install -r requirements.txt
        & "C:\Users\USER\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pip install pytest pytest-cov
      shell: powershell

    - name: Run tests
      run: |
        cd sample-app
        # This will fail if SIMULATE_FAILURE env is set in the test context
        & "C:\Users\USER\AppData\Local\Python\pythoncore-3.14-64\python.exe" -m pytest tests/ || echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
      shell: powershell

    - name: Trigger AI Healing on Test Failure
      if: env.TESTS_FAILED == 'true'
      run: |
        Write-Host "🚨 Tests Failed! Triggering AI Agent..."
        Invoke-RestMethod -Method Post -Uri "${{ secrets.AI_AGENT_URL }}/heal" -ContentType "application/json" -Body (ConvertTo-Json @{
          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"
          job = "test"
          branch = "${{ github.ref_name }}"
          failure_type = "test_failure"
        })
        Write-Host "Failure detected. Payload prepared."
      shell: powershell

  deploy:
    needs: [build, test]
    runs-on: [self-hosted, windows]
    if: success() && github.ref == 'refs/heads/develop-1'

    steps:
    - name: Mock Deployment
      run: Write-Host "Deploying version ${{ needs.build.outputs.version }} to Production K8s Cluster"
      shell: powershell