name: CI/CD Pipeline

on:
  push:
    branches: [ develop-1 ]
  pull_request:
    branches: [ develop-1 ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: [self-hosted, windows]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0,7))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: powershell

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ./sample-app
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }}
        docker tag ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ${{ env.DOCKER_USERNAME }}/sample-app:latest
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:latest
      shell: powershell

  test:
    needs: build
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Portable Python
      id: setup-python
      run: |
        $dest = "$env:GITHUB_WORKSPACE\python_dist"
        $pythonObj = "$dest\python.exe"
        
        if (Test-Path $pythonObj) {
            Write-Host "Python already exists at $pythonObj"
        } else {
            $url = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
            $zip = "$dest\python.zip"
            
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            
            Write-Host "Downloading Python 3.11..."
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            Invoke-WebRequest -Uri $url -OutFile $zip
            
            Write-Host "Extracting..."
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            
            # Enable 'import site' for pip support
            $pth = "$dest\python311._pth"
            if (Test-Path $pth) {
                (Get-Content $pth).Replace("#import site", "import site") | Set-Content $pth
            }
            
            # Install pip
            Write-Host "Installing pip..."
            Invoke-WebRequest -Uri https://bootstrap.pypa.io/get-pip.py -OutFile "$dest\get-pip.py"
            & $pythonObj "$dest\get-pip.py" --no-warn-script-location
        }
        
        echo "PY_CMD=$pythonObj" >> $env:GITHUB_ENV
        # Add Scripts to PATH so pip modules are found if needed
        echo "$dest\Scripts" >> $env:GITHUB_PATH
      shell: powershell

    - name: Install dependencies
      run: |
        cd sample-app
        & "$env:PY_CMD" -m pip install --upgrade pip
        & "$env:PY_CMD" -m pip install -r requirements.txt
        & "$env:PY_CMD" -m pip install pytest pytest-cov
      shell: powershell

    - name: Run tests
      run: |
        cd sample-app
        # Add current directory to PYTHONPATH so 'src' module can be found
        $env:PYTHONPATH = ".;$env:PYTHONPATH"
        
        # This will fail if SIMULATE_FAILURE env is set in the test context
        & "$env:PY_CMD" -m pytest tests/
        if ($LASTEXITCODE -ne 0) {
          echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
        }
      shell: powershell

    - name: Trigger AI Healing on Test Failure
      if: env.TESTS_FAILED == 'true'
      run: |
        Write-Host "🚨 Tests Failed! Triggering AI Agent..."
        Invoke-RestMethod -Method Post -Uri "${{ secrets.AI_AGENT_URL }}/heal" -ContentType "application/json" -Body (ConvertTo-Json @{
          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"
          job = "test"
          branch = "${{ github.ref_name }}"
          failure_type = "test_failure"
        })
        Write-Host "Failure detected. Payload prepared."
      shell: powershell

  deploy:
    needs: [build, test]
    runs-on: [self-hosted, windows]
    if: success() && github.ref == 'refs/heads/develop-1'

    steps:
    - name: Deploy to Local K8s
      run: |
        Write-Host "Deploying version ${{ needs.build.outputs.version }} to Local K8s Cluster"
        
        # Explicitly set KUBECONFIG to ensure kubectl finds the cluster
        $env:KUBECONFIG = "C:\Users\USER\.kube\config"
        
        # Check if kubectl is available (should be on self-hosted runner)
        kubectl version --client
        
        # Update the image in the deployment
        # Note: 'sample-app' is the deployment name, 'app' is the container name
        kubectl set image deployment/sample-app app=${{ env.DOCKER_USERNAME }}/sample-app:${{ needs.build.outputs.version }}
        
        # Verify rollout status
        kubectl rollout status deployment/sample-app
      shell: powershell