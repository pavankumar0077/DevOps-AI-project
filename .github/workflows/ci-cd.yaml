name: CI/CD Pipeline

on:
  push:
    branches: [ develop-1 ]
  pull_request:
    branches: [ develop-1 ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # For local dev/demo, we often simulate this or use a simplified approach
  # In a real scenario, this connects to the K8s cluster

jobs:
  build:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0,7))"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ./sample-app
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }}
        # Also push latest tag for convenience
        docker tag ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ${{ env.DOCKER_USERNAME }}/sample-app:latest
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:latest

  test:
    needs: build
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd sample-app
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        cd sample-app
        # This will fail if SIMULATE_FAILURE env is set in the test context
        pytest tests/ || echo "TESTS_FAILED=true" >> $GITHUB_ENV

    - name: Trigger AI Healing on Test Failure
      if: env.TESTS_FAILED == 'true'
      run: |
        echo "🚨 Tests Failed! Triggering AI Agent..."
        curl -X POST ${{ secrets.AI_AGENT_URL }}/heal -H "Content-Type: application/json" -d "{\"repo\": \"${{ github.repository }}\", \"run_id\": \"${{ github.run_id }}\", \"job\": \"test\", \"branch\": \"${{ github.ref_name }}\", \"failure_type\": \"test_failure\"}"
        echo "Failure detected. Payload preparation simulated."

  deploy:
    needs: [build, test]
    runs-on: self-hosted
    if: success() && github.ref == 'refs/heads/develop-1'
    
    steps:
    - name: Mock Deployment
      run: echo "Deploying version ${{ needs.build.outputs.version }} to Production K8s Cluster"
