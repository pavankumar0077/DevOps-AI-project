name: CI/CD Pipeline

on:
  push:
    branches: [ develop-1 ]
  pull_request:
    branches: [ develop-1 ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0,7))"
        echo "version=$version" >> $env:GITHUB_OUTPUT

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ./sample-app
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }}
        docker tag ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ${{ env.DOCKER_USERNAME }}/sample-app:latest
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:latest

  test:
    needs: build
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug Environment
      run: |
        echo "HOSTNAME: $env:COMPUTERNAME"
        echo "USERNAME: $env:USERNAME"
        echo "Check python (where & launcher):"
        where.exe python || echo "where python returned non-zero"
        where.exe py || echo "where py returned non-zero"
        Write-Host "Get-Command python (if present):"
        Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
        Write-Host "Get-Command py (if present):"
        Get-Command py -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
        py -3 --version 2>$null || echo "py launcher not found or failed"
        echo "PATH:"
        echo $env:PATH
      shell: pwsh

    # Optional fallback: uncomment to force-download a Python runtime if `py` is not present
    # - name: Set up Python (fallback)
    #   if: always() && !contains(steps.debug.outputs.some_marker, 'py-present') # placeholder, not active
    #   uses: actions/setup-python@v4
    #   with:
    #     python-version: '3.11'

    - name: Install dependencies
      run: |
        cd sample-app
        py -3 -m pip install --upgrade pip
        py -3 -m pip install -r requirements.txt
        py -3 -m pip install pytest pytest-cov
      shell: pwsh

    - name: Run tests
      run: |
        cd sample-app
        # Run pytest. On failure, set TESTS_FAILED so the later step triggers.
        py -3 -m pytest tests/ || echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Trigger AI Healing on Test Failure
      if: env.TESTS_FAILED == 'true'
      run: |
        echo "🚨 Tests Failed! Triggering AI Agent..."
        curl -X POST ${{ secrets.AI_AGENT_URL }}/heal -H "Content-Type: application/json" -d "{\"repo\": \"${{ github.repository }}\", \"run_id\": \"${{ github.run_id }}\", \"job\": \"test\", \"branch\": \"${{ github.ref_name }}\", \"failure_type\": \"test_failure\"}"
        echo "Failure detected. Payload preparation simulated."
      shell: pwsh

  deploy:
    needs: [build, test]
    runs-on: self-hosted
    if: success() && github.ref == 'refs/heads/develop-1'
    
    steps:
    - name: Mock Deployment
      run: echo "Deploying version ${{ needs.build.outputs.version }} to Production K8s Cluster"