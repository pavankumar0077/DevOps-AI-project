name: CI/CD Pipeline

on:
  push:
    branches: [ develop-1 ]
  pull_request:
    branches: [ develop-1 ]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build:
    runs-on: [self-hosted, windows]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate version
      id: version
      run: |
        $version = "$(Get-Date -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0,7))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: powershell

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ./sample-app
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }}
        docker tag ${{ env.DOCKER_USERNAME }}/sample-app:${{ steps.version.outputs.version }} ${{ env.DOCKER_USERNAME }}/sample-app:latest
        docker push ${{ env.DOCKER_USERNAME }}/sample-app:latest
      shell: powershell

  test:
    needs: build
    runs-on: [self-hosted, windows]
    defaults:
      run:
        shell: powershell

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug Environment
      run: |
        Write-Host "HOSTNAME: $env:COMPUTERNAME"
        Write-Host "USERNAME: $env:USERNAME"
        Write-Host "Check python (where & launcher):"

        where.exe python > $null 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "where python returned non-zero"
        } else {
          Write-Host "where python succeeded"
        }

        where.exe py > $null 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Host "where py returned non-zero"
        } else {
          Write-Host "where py succeeded"
        }

        Write-Host "Get-Command python (if present):"
        try {
          $p = Get-Command python -ErrorAction Stop
          Write-Host $p.Source
        } catch {
          Write-Host "Get-Command python not found"
        }

        Write-Host "Get-Command py (if present):"
        try {
          $p2 = Get-Command py -ErrorAction Stop
          Write-Host $p2.Source
        } catch {
          Write-Host "Get-Command py not found"
        }

        Write-Host "pwsh present?"
        where.exe pwsh > $null 2>&1
        if ($LASTEXITCODE -ne 0) { Write-Host "pwsh not found" } else { Write-Host "pwsh found" }

        Write-Host "powershell present?"
        try {
          $ps = Get-Command powershell -ErrorAction Stop
          Write-Host $ps.Source
        } catch {
          Write-Host "powershell command not found"
        }

        & py -3 --version 2>$null
        if ($LASTEXITCODE -ne 0) { Write-Host "py launcher not available or failed" } else { Write-Host "py -3 OK" }

        Write-Host "PATH:"
        Write-Host $env:PATH
      shell: powershell

    - name: Detect Python and set PY_CMD
      id: detect-python
      run: |
        # Prefer the py launcher
        where.exe py > $null 2>&1
        if ($LASTEXITCODE -eq 0) {
          echo "PY_CMD=py" >> $env:GITHUB_ENV
          echo "PY_ARGS=-3" >> $env:GITHUB_ENV
          Write-Host "Selected: py -3"
          exit 0
        }

        # Fallback to python on PATH
        where.exe python > $null 2>&1
        if ($LASTEXITCODE -eq 0) {
          echo "PY_CMD=python" >> $env:GITHUB_ENV
          echo "PY_ARGS=" >> $env:GITHUB_ENV
          Write-Host "Selected: python"
          exit 0
        }

        # Fallback to a common explicit path (adjust if your python.exe is elsewhere)
        $explicit = 'C:\Users\USER\AppData\Local\Programs\Python\Python310\python.exe'
        if (Test-Path $explicit) {
          echo "PY_CMD=$explicit" >> $env:GITHUB_ENV
          echo "PY_ARGS=" >> $env:GITHUB_ENV
          Write-Host "Selected explicit: $explicit"
          exit 0
        }

        Write-Host "No usable Python found (py, python, or explicit path)."
        exit 1
      shell: powershell

    - name: Install dependencies
      run: |
        cd sample-app

        if ($env:PY_CMD -eq 'py') {
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r requirements.txt
          py -3 -m pip install pytest pytest-cov
        } elseif ($env:PY_CMD -eq 'python') {
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
        } else {
          # PY_CMD is an explicit path to python.exe
          & "$env:PY_CMD" -m pip install --upgrade pip
          & "$env:PY_CMD" -m pip install -r requirements.txt
          & "$env:PY_CMD" -m pip install pytest pytest-cov
        }
      shell: powershell

    - name: Run tests
      run: |
        cd sample-app
        if ($env:PY_CMD -eq 'py') {
          py -3 -m pytest tests/ || echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
        } elseif ($env:PY_CMD -eq 'python') {
          python -m pytest tests/ || echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
        } else {
          & "$env:PY_CMD" -m pytest tests/ || echo "TESTS_FAILED=true" >> $env:GITHUB_ENV
        }
      shell: powershell

    - name: Trigger AI Healing on Test Failure
      if: env.TESTS_FAILED == 'true'
      run: |
        Write-Host "🚨 Tests Failed! Triggering AI Agent..."
        Invoke-RestMethod -Method Post -Uri "${{ secrets.AI_AGENT_URL }}/heal" -ContentType "application/json" -Body (ConvertTo-Json @{
          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"
          job = "test"
          branch = "${{ github.ref_name }}"
          failure_type = "test_failure"
        })
        Write-Host "Failure detected. Payload prepared."
      shell: powershell

  deploy:
    needs: [build, test]
    runs-on: [self-hosted, windows]
    if: success() && github.ref == 'refs/heads/develop-1'

    steps:
    - name: Mock Deployment
      run: Write-Host "Deploying version ${{ needs.build.outputs.version }} to Production K8s Cluster"
      shell: powershell