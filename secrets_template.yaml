apiVersion: v1
kind: Secret
metadata:
  name: ai-agent-secrets
  namespace: default
type: Opaque
stringData:
  # Rename GITHUB_TOKEN to AIDEVOPS_TOKEN as per requirement
  AIDEVOPS_TOKEN: "your_github_token_here"
  OPENAI_API_KEY: "your_openai_key_here"
  SLACK_WEBHOOK_URL: "your_slack_webhook_url_here"
