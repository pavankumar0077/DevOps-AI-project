apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent
  namespace: default
  labels:
    app: ai-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-agent
  template:
    metadata:
      labels:
        app: ai-agent
    spec:
      containers:
      - name: agent
        image: pavan0077/ai-agent:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: ai-agent-secrets
        volumeMounts:
        - name: chroma-storage
          mountPath: /app/chroma_db
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: chroma-storage
        persistentVolumeClaim:
          claimName: chroma-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent
  namespace: default
spec:
  type: LoadBalancer 
  selector:
    app: ai-agent
  ports:
  - port: 80
    targetPort: 8000
