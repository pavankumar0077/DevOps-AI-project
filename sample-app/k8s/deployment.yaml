apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: default
  labels:
    app: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
      - name: app
        image: pavan0077/sample-app:latest
        imagePullPolicy: Always # Important for local dev
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          value: "v1.0.0"
        - name: SIMULATE_FAILURE
          value: "false"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
